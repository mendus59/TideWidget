<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tide Map</title>
  <meta name="description" content="Live tide map of US coasts and the next high and low tide for your beach, from NOAA predictions.">
  <meta name="theme-color" content="#0b2540">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="map" aria-label="Tide map"></div>

  <header class="topbar">
    <div class="search">
      <input id="search" type="search" placeholder="Find a beach or station" autocomplete="off" aria-label="Find a station">
      <ul id="results" role="listbox" hidden></ul>
    </div>
  </header>

  <!-- The web stand-in for the Android home-screen widget. -->
  <button id="mybeach" class="card mybeach" type="button" aria-label="My beach">
    <div class="mb-head"><span class="pin" aria-hidden="true">📍</span><span id="mb-name">My beach</span></div>
    <div class="mb-row"><span class="arrow hi">▲</span><span class="lbl">High</span><span id="mb-high">—</span></div>
    <div class="mb-row"><span class="arrow lo">▼</span><span class="lbl">Low</span><span id="mb-low">—</span></div>
    <svg id="mb-curve" class="spark" viewBox="0 0 200 36" preserveAspectRatio="none" aria-hidden="true"></svg>
  </button>

  <div id="error" class="toast" hidden></div>

  <section class="card scrubber" aria-label="Time">
    <div class="scrub-head">
      <span class="legend"><i style="background:rgb(33,89,204)"></i>Low</span>
      <button id="play" class="play" type="button" aria-label="Play 24 hours">▶</button>
      <strong id="time">Now</strong>
      <button id="now" class="nowbtn" type="button">Now</button>
      <span class="legend">High<i style="background:rgb(224,56,51)"></i></span>
    </div>
    <input id="slider" type="range" min="0" max="24" step="0.25" value="0" aria-label="Hours from now">
  </section>

  <section id="sheet" class="sheet" hidden aria-live="polite">
    <button id="sheet-close" class="close" type="button" aria-label="Close">✕</button>
    <h2 id="sheet-title"></h2>
    <p id="sheet-sub" class="sub"></p>
    <div class="range" role="group" aria-label="Curve range">
      <button type="button" data-hours="24">24 hours</button>
      <button type="button" data-hours="168" aria-pressed="true">7 days</button>
    </div>
    <svg id="sheet-curve" class="curve" viewBox="0 0 400 140" preserveAspectRatio="none" role="img" aria-label="Tide curve"></svg>
    <div id="sheet-axis" class="axis"></div>
    <ul id="sheet-list" class="events"></ul>
    <button id="sheet-use" class="primary" type="button">Make this my beach</button>
  </section>

  <footer class="credit">Predictions: <a href="https://tidesandcurrents.noaa.gov/" target="_blank" rel="noopener">NOAA CO-OPS</a>. Not for navigation.</footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
